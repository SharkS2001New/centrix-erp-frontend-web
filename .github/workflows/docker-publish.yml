name: Docker Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build-print-agent-msi.yml"
      # NOTE: print-agent/** and print-agent-dotnet/** are intentionally NOT
      # ignored. Both are baked into the runtime image (see Dockerfile) and
      # served at runtime by /api/print-agent/file/[name] and
      # /api/print-agent/dotnet-source. Changes to them must rebuild the image.
      - "attendance-agent/**"
      - "attendance-agent-dotnet/**"
      - "kra-agent/**"
      - "kra-agent-dotnet/**"
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build-print-agent-msi.yml"
      - "attendance-agent/**"
      - "attendance-agent-dotnet/**"
      - "kra-agent/**"
      - "kra-agent-dotnet/**"
  # Nightly schedule removed — it rebuilt the same sha-tagged image for zero
  # benefit. Re-enable only if base image CVE patching becomes a requirement.

# Serialize publishes on the same ref so concurrent pushes don't race the
# downstream Helm commit. Do NOT cancel in-progress runs here — a half-published
# image + half-updated Helm values is worse than a short queue.
concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: centrix-erp-frontend-web

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: type=sha,format=short

      - name: Resolve image tag for Helm
        id: image_tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ignore-error: GHA cache export can 504 after a successful push and
          # must not fail the job (image is already on ghcr.io).
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.centrixerp.co.ke/api/v1' }}
            NEXT_PUBLIC_USE_COOKIE_AUTH=${{ vars.NEXT_PUBLIC_USE_COOKIE_AUTH || 'true' }}
            NEXT_PUBLIC_COMPANY_CODE=${{ vars.NEXT_PUBLIC_COMPANY_CODE || 'DEMO' }}
            NEXT_PUBLIC_COMPANY_NAME=${{ vars.NEXT_PUBLIC_COMPANY_NAME || 'Centrix ERP' }}
            NEXT_PUBLIC_REVERB_APP_KEY=${{ vars.NEXT_PUBLIC_REVERB_APP_KEY || 'centrix-prod-reverb' }}
            NEXT_PUBLIC_REVERB_HOST=${{ vars.NEXT_PUBLIC_REVERB_HOST || 'api.centrixerp.co.ke' }}
            NEXT_PUBLIC_REVERB_PORT=${{ vars.NEXT_PUBLIC_REVERB_PORT || '443' }}
            NEXT_PUBLIC_REVERB_SCHEME=${{ vars.NEXT_PUBLIC_REVERB_SCHEME || 'https' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.centrixerp.co.ke' }}

      # Notify centrixerpk3setup that a new image is published. That repo's
      # deploy.yml listens for frontend-image-published, bumps the tag in
      # centrix-erp-frontend-web/values.yaml on main, and runs helm upgrade
      # from the self-hosted runner on the k3s host.
      #
      # CENTRIXERPK3SETUP_DISPATCH_TOKEN is a fine-grained PAT owned by
      # chegelawrence, scoped to chegelawrence/centrixerpk3setup only with
      # Contents: Read/write + Actions: Read/write. It is NOT interchangeable
      # with PERSONAL_ACCESS_TOKEN (which belongs to SharkS2001New and only
      # has write:packages for GHCR).
      - name: Dispatch deploy to centrixerpk3setup
        if: github.event_name != 'pull_request'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CENTRIXERPK3SETUP_DISPATCH_TOKEN }}
          repository: chegelawrence/centrixerpk3setup
          event-type: frontend-image-published
          client-payload: |
            {
              "tag": "${{ steps.image_tag.outputs.value }}",
              "sha": "${{ github.sha }}",
              "source_repo": "${{ github.repository }}",
              "source_run_id": "${{ github.run_id }}"
            }
