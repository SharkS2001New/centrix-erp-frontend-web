name: Docker Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build-print-agent-msi.yml"
      - "print-agent/**"
      - "print-agent-dotnet/**"
      - "attendance-agent/**"
      - "attendance-agent-dotnet/**"
      - "kra-agent/**"
      - "kra-agent-dotnet/**"
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build-print-agent-msi.yml"
      - "print-agent/**"
      - "print-agent-dotnet/**"
      - "attendance-agent/**"
      - "attendance-agent-dotnet/**"
      - "kra-agent/**"
      - "kra-agent-dotnet/**"
  # Nightly schedule removed — it rebuilt the same sha-tagged image for zero
  # benefit. Re-enable only if base image CVE patching becomes a requirement.

# Serialize publishes on the same ref so concurrent pushes don't race the
# downstream Helm commit. Do NOT cancel in-progress runs here — a half-published
# image + half-updated Helm values is worse than a short queue.
concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: centrix-erp-frontend-web

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: type=sha,format=short

      - name: Resolve image tag for Helm
        id: image_tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ignore-error: GHA cache export can 504 after a successful push and
          # must not fail the job (image is already on ghcr.io).
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://centrixapi.betsassured.com/api/v1' }}
            NEXT_PUBLIC_USE_COOKIE_AUTH=${{ vars.NEXT_PUBLIC_USE_COOKIE_AUTH || 'true' }}
            NEXT_PUBLIC_COMPANY_CODE=${{ vars.NEXT_PUBLIC_COMPANY_CODE || 'DEMO' }}
            NEXT_PUBLIC_COMPANY_NAME=${{ vars.NEXT_PUBLIC_COMPANY_NAME || 'Centrix ERP' }}
            NEXT_PUBLIC_REVERB_APP_KEY=${{ vars.NEXT_PUBLIC_REVERB_APP_KEY || 'centrix-prod-reverb' }}
            NEXT_PUBLIC_REVERB_HOST=${{ vars.NEXT_PUBLIC_REVERB_HOST || 'centrixapi.betsassured.com' }}
            NEXT_PUBLIC_REVERB_PORT=${{ vars.NEXT_PUBLIC_REVERB_PORT || '443' }}
            NEXT_PUBLIC_REVERB_SCHEME=${{ vars.NEXT_PUBLIC_REVERB_SCHEME || 'https' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || '' }}

      - name: Check out centrixerpk3setup
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/centrixerpk3setup
          path: centrixerpk3setup
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Update Helm image tag
        if: github.event_name != 'pull_request'
        run: |
          TAG="${{ steps.image_tag.outputs.value }}"
          FILE="centrixerpk3setup/centrix-erp-frontend-web/values.yaml"
          sed -i "s|^\([[:space:]]*tag:\).*|\1 ${TAG}|" "$FILE"
          echo "Updated ${FILE} -> ${TAG}"

      - name: Commit and push centrixerpk3setup
        if: github.event_name != 'pull_request'
        run: |
          cd centrixerpk3setup
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add centrix-erp-frontend-web/values.yaml
          if git diff --staged --quiet; then
            echo "No tag changes to commit."
            exit 0
          fi
          git commit -m "chore(centrix-erp-frontend-web): bump image tag to ${{ steps.image_tag.outputs.value }}"
          DEFAULT_BRANCH="$(git symbolic-ref --short HEAD)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$DEFAULT_BRANCH"
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); retrying after rebase…"
            sleep $((attempt * 2))
          done
          echo "Failed to push centrixerpk3setup after 5 attempts."
          exit 1
